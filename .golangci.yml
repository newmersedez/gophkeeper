version: "2"

run:
  timeout: 5m
  tests: false

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - gosec
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      - path: (.+)_test\.go
        linters:
          - gosec
          - errcheck
          - unparam
      - text: "G101:"
        linters:
          - gosec
      - text: "G505:"
        linters:
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
